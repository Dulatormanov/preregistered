# credentials.toml: every secret this project uses, what it can do, when it expires, and what it must never do.
# No value is ever written here or anywhere in the repo. The watchdog (Build day 1) warns 14 days before an expiry.
# "expires" is a date (YYYY-MM-DD), "never", or "per run".

# ---------------------------------------------------------------- GitHub Actions secrets

[[secret]]
name = "PREREG_READ_TOKEN"
what = "GitHub fine-grained token 'prereg-read'"
used_by = "the poll job (tick.yml), to list new supabase/supabase issues"
can = "read public repositories; it has no permissions"
must_never = "write anything, anywhere"
expires = "2027-02-01"  # 19:00 UTC, from GitHub's github-authentication-token-expiration header (Check 9)
rotate = "create a new 'prereg-read' in the browser, save it with gh secret set, then delete the old one"

[[secret]]
name = "TRIAGE_DB_URL"
what = "Supabase session pooler login for the role triage_agent"
used_by = "the poll job"
can = "call its functions only: enqueue, claim, complete, record a failure or a probe, log a polled event, and five reads (newest_first_sight, unanchored_guesses, spend_today, recent_provider_failures, losses_since); no table right"
must_never = "change or delete a row, set an id or a time, or add an anchor (check_roles.sql, tests/test_db_grants.py)"
expires = "never"
rotate = "scripts/role_password.py triage_agent, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "NOTARY_DB_URL"
what = "Supabase session pooler login for the role notary"
used_by = "the anchor job"
can = "add anchors through record_anchor only; read predictions and anchors"
must_never = "change or delete a row, set an id or a time, or add a guess"
expires = "never"
rotate = "scripts/role_password.py notary, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "COLLECTOR_DB_URL"
what = "Supabase session pooler login for the role collector"
used_by = "the daily outcomes job (outcomes.yml)"
can = "add label events through record_outcome only; read issues_seen"
must_never = "add, change or delete a guess, an anchor or any other row"
expires = "never"
rotate = "scripts/role_password.py collector, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "OBSERVER_DB_URL"
what = "Supabase session pooler login for the role observer"
used_by = "the read-only jobs: the weekly report build, the watchdog check and the drift check"
can = "read every ledger table"
must_never = "add, change or delete any row; reach a job that can post (the post job gets only the report text)"
expires = "never"
rotate = "scripts/role_password.py observer, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "GATE_DB_URL"
what = "Supabase session pooler login for the role gate_runner"
used_by = "the eval suites: suite.yml, the eval-gate check (gate.yml) and the weekly known-bad control; later the model check"
can = "record the steps of its own model calls (job gate or check:<model>) and read spend; no table right"
must_never = "add a guess, an anchor or a live step, or change any row (check_roles.sql, tests/test_db_grants.py)"
expires = "never"
rotate = "scripts/role_password.py gate_runner, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "ADOPTER_DB_URL"
what = "Supabase session pooler login for the role adopter, a secret of the environment adopt (main only)"
used_by = "the model watcher (watch.yml) and the one sealed run (sealed.yml)"
can = "record the models it saw, a challenger's guesses, verdicts and the champion's sealed guesses, and read spend"
must_never = "reach a pull request's code: the environment adopt lets only main use it, so no branch can write a sealed guess"
expires = "never"
rotate = "scripts/role_password.py adopter, run the ALTER ROLE line as postgres, then gh secret set ADOPTER_DB_URL --env adopt"

[[secret]]
name = "PROPOSER_DB_URL"
what = "Supabase session pooler login for the role proposer"
used_by = "the plan job of promote.yml"
can = "save one bundle a day (the database checks its hash), read the kill switch and each area's live record, record its model call"
must_never = "claim an approval or log a write: only gateway_svc can, after the owner approved"
expires = "never"
rotate = "scripts/role_password.py proposer, run the ALTER ROLE line as postgres, then gh secret set PROPOSER_DB_URL"

[[secret]]
name = "GATEWAY_DB_URL"
what = "Supabase session pooler login for the role gateway_svc, a secret of the environment sandbox-write"
used_by = "the apply job of promote.yml, after the owner approved it"
can = "read a bundle, claim its approval once, log each gateway step and probe result, read the kill switch"
must_never = "propose a bundle, or reach any job the owner did not approve"
expires = "never"
rotate = "scripts/role_password.py gateway_svc, run the ALTER ROLE line as postgres, then gh secret set GATEWAY_DB_URL --env sandbox-write"

[[secret]]
name = "NOTIFIER_DB_URL"
what = "Supabase session pooler login for the role notifier"
used_by = "the jobs that post: the alert jobs, the weekly report's post job"
can = "spend one contact from the budget (prereg.spend_contact); nothing else"
must_never = "read or write anything else: it cannot even read the ledger"
expires = "never"
rotate = "scripts/role_password.py notifier, run the ALTER ROLE line as postgres, then gh secret set NOTIFIER_DB_URL"

[[secret]]
name = "REDRIVER_DB_URL"
what = "Supabase session pooler login for the role redriver, a secret of the environment adopt (main only)"
used_by = "redrive.yml, started by hand, on main only"
can = "put one dead letter back in the work queue, with a logged event; read the queue's health"
must_never = "reach a pull request's code: the environment adopt lets only main use it"
expires = "never"
rotate = "scripts/role_password.py redriver, run the ALTER ROLE line as postgres, then gh secret set REDRIVER_DB_URL --env adopt"

[[secret]]
name = "ANTHROPIC_API_KEY"
what = "the owner's existing Anthropic API key (a personal key)"
used_by = "the poll job only; the anchor job never gets it"
can = "call Claude models; the Admin API refuses it (checked on 2026-11-04)"
must_never = "spend more than $3 a day for the live job (DAILY_CAP_USD in runner/worker.py, checked with prereg.spend_today); it has no workspace limit"
expires = "unknown"  # shown on the Console's API keys page
rotate = "create a key in the Console, save it with gh secret set, then disable the old one"

[[secret]]
name = "HC_TICK_URL"
what = "Healthchecks.io ping URL of the check 'tick' (period 15 min, grace 30 min)"
used_by = "both jobs, once per healthy tick"
can = "mark the check as up"
must_never = "be pinged after a failed tick"
expires = "never"
rotate = "create a new check in Healthchecks, save its URL with gh secret set, then delete the old check"

[[secret]]
name = "HC_WATCHDOG_URL"
what = "the ping URL of the Healthchecks check 'watchdog' (period 30 minutes, grace 30 minutes)"
used_by = "the watchdog's check job, once at the end of every run"
can = "mark the watchdog as alive"
must_never = "be shared: anyone with it can hide a dead watchdog"
expires = "never"
rotate = "make a new ping URL in Healthchecks, then gh secret set HC_WATCHDOG_URL"

[[secret]]
name = "GITHUB_TOKEN"
what = "the short-lived token GitHub gives each workflow run"
used_by = "every job: contents: read for the checkout (not kept on disk). issues: write in six jobs only: the anchor job and the alert or post jobs of outcomes.yml, weekly.yml, watchdog.yml, known-bad-control.yml and drift.yml; actions: read where a job reads runs or results (weekly build, watchdog check, eval-gate, known-bad control); actions: write in dispatch.yml"
can = "where it has issues: write, comment on, label or close issues in this repo (GitHub has no comment-only permission); in dispatch.yml, start or cancel this repo's runs"
must_never = "write anything but a Notary log anchor, an alert issue, a weekly report comment or the start of a probe run"
expires = "per run"
rotate = "nothing to rotate"

# ---------------------------------------------------------------- only on the owner's Mac

[[secret]]
name = "prereg/postgres"
what = "the postgres password of prereg-prod, in the macOS keychain"
used_by = "applying migrations from the owner's Mac"
can = "everything in the database, including SET ROLE prereg_owner"
must_never = "be stored in GitHub, in a file, or in the repo"
expires = "2026-11-20"  # reset at the end of Build day 8, which ends this access
rotate = "Supabase dashboard > Database > Settings > Reset password, then update the keychain item"

[[secret]]
name = "prereg/triage_agent, prereg/notary, prereg/observer, prereg/collector, prereg/gate_runner, prereg/adopter, prereg/proposer, prereg/gateway_svc, prereg/notifier, prereg/redriver"
what = "the role passwords, in the macOS keychain"
used_by = "the grant test and local checks; Actions holds its own copies inside the DB URLs"
can = "log in as that role"
must_never = "be typed into SQL: only SCRAM verifiers go to the database (scripts/role_password.py)"
expires = "never"
rotate = "scripts/role_password.py <role>, then update the matching GitHub secret"

[[secret]]
name = "the gh CLI token"
what = "the owner's GitHub CLI login (classic OAuth token: repo, workflow, read:org, gist)"
used_by = "pushes and gh secret set from the owner's Mac"
can = "write to every repository of the owner"
must_never = "be stored as a secret of any repository"
expires = "never"
rotate = "replaced on Day 6 by a fine-grained token for this repo only"

# ---------------------------------------------------------------- the privilege matrix
# tests/test_privilege_matrix.py checks that every role except superusers, prereg_owner and the pg_* roles
# holds exactly this in schemas prereg and pgmq, and nothing more. "*" means every table, or every sequence.
# A role not listed (anon, authenticated, service_role and the other platform roles) holds nothing there.
# prereg_owner owns the ledger and its functions; for them it holds USAGE on schema pgmq and SELECT,
# INSERT, UPDATE and DELETE on pgmq.q_triage_events and pgmq.q_triage_dlq (db/004_functions.sql).

[privileges.triage_agent]  # no table right at all since db/006_revoke.sql: functions only
usage = ["prereg"]
execute = ["claim_next", "complete", "enqueue_issue", "log_event", "losses_since", "newest_first_sight",
           "recent_provider_failures", "record_failure", "record_probe", "spend_today", "unanchored_guesses"]

[privileges.notary]
usage = ["prereg"]
select = ["anchors", "predictions"]  # the rows it hashes
execute = ["record_anchor"]

[privileges.collector]
usage = ["prereg"]
select = ["issues_seen"]
execute = ["record_outcome"]

[privileges.observer]
usage = ["prereg"]
select = ["*"]  # default privileges give observer every new table
execute = ["queue_health"]  # the watchdog's read of the queues, which observer cannot read itself

[privileges.adopter]  # functions only: the model watcher and the one sealed run
usage = ["prereg"]
execute = ["model_first_seen", "models_seen_count", "paid_checks", "record_challenger_guess", "record_gate_step",
           "record_model_seen", "record_sealed_guess", "record_verdict", "sealed_answers", "sealed_count", "sealed_rows",
           "spend_today", "spend_total"]

[privileges.proposer]  # functions only: the plan job of promote.yml
usage = ["prereg"]
execute = ["area_live_counts", "propose_bundle", "record_gate_step", "spend_contact", "spend_today", "switch_enabled"]

[privileges.gateway_svc]  # functions only: the apply job of promote.yml, the only job with the sandbox write token
usage = ["prereg"]
execute = ["claim_consent", "get_bundle", "record_probe_result", "record_write", "switch_enabled"]

[privileges.notifier]  # functions only: the jobs that post spend from the contact budget first
usage = ["prereg"]
execute = ["spend_contact"]

[privileges.redriver]  # functions only: redrive.yml, which only main may run
usage = ["prereg"]
execute = ["queue_health", "redrive_dlq"]

[privileges.gate_runner]  # functions only, as triage_agent
usage = ["prereg"]
execute = ["record_gate_step", "spend_today", "spend_total"]

# Supabase makes these three members of pg_read_all_data: they read everything and change nothing.
[privileges.postgres]
usage = ["prereg", "pgmq"]
create = ["pgmq"]  # postgres created the pgmq extension, so it owns that schema
select = ["*"]
sequence_select = ["*"]
execute = ["sweep_abandoned"]  # the pg_cron sweeper runs as postgres (db/008_cron.sql)

[privileges.supabase_etl_admin]
usage = ["prereg", "pgmq"]
select = ["*"]
sequence_select = ["*"]

[privileges.supabase_read_only_user]
usage = ["prereg", "pgmq"]
select = ["*"]
sequence_select = ["*"]
