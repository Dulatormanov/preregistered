# credentials.toml: every secret this project uses, what it can do, when it expires, and what it must never do.
# No value is ever written here or anywhere in the repo. The watchdog (Build day 1) warns 14 days before an expiry.
# "expires" is a date (YYYY-MM-DD), "never", or "per run".

# ---------------------------------------------------------------- GitHub Actions secrets

[[secret]]
name = "PREREG_READ_TOKEN"
what = "GitHub fine-grained token 'prereg-read'"
used_by = "the poll job (tick.yml), to list new supabase/supabase issues"
can = "read public repositories; it has no permissions"
must_never = "write anything, anywhere"
expires = "pending"  # Check 9: the poll job saves GitHub's github-authentication-token-expiration header
rotate = "create a new 'prereg-read' in the browser, save it with gh secret set, then delete the old one"

[[secret]]
name = "TRIAGE_DB_URL"
what = "Supabase session pooler login for the role triage_agent"
used_by = "the poll job"
can = "add first sights, guesses, steps and run events; read issues_seen, predictions, steps and anchors"
must_never = "change or delete a row, set an id or a time, or add an anchor (check_roles.sql, tests/test_db_grants.py)"
expires = "never"
rotate = "scripts/role_password.py triage_agent, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "NOTARY_DB_URL"
what = "Supabase session pooler login for the role notary"
used_by = "the anchor job"
can = "add anchors; read predictions and anchors"
must_never = "change or delete a row, set an id or a time, or add a guess"
expires = "never"
rotate = "scripts/role_password.py notary, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "ANTHROPIC_API_KEY"
what = "the owner's existing Anthropic API key (a personal key)"
used_by = "the poll job only; the anchor job never gets it"
can = "call Claude models; the Admin API refuses it (checked on 2026-11-04)"
must_never = "spend more than $3 a day for the live job (the cap in runner/poll.py); it has no workspace limit"
expires = "unknown"  # shown on the Console's API keys page
rotate = "create a key in the Console, save it with gh secret set, then disable the old one"

[[secret]]
name = "HC_TICK_URL"
what = "Healthchecks.io ping URL of the check 'tick' (period 15 min, grace 30 min)"
used_by = "both jobs, once per healthy tick"
can = "mark the check as up"
must_never = "be pinged after a failed tick"
expires = "never"
rotate = "create a new check in Healthchecks, save its URL with gh secret set, then delete the old check"

[[secret]]
name = "GITHUB_TOKEN"
what = "the short-lived token GitHub gives each workflow run"
used_by = "both jobs: contents: read for the checkout (not kept on disk); the anchor job also gets issues: write"
can = "in the anchor job: comment on, label or close issues in this repo; GitHub has no comment-only permission"
must_never = "be used by any code but notary/anchor.py"
expires = "per run"
rotate = "nothing to rotate"

# ---------------------------------------------------------------- only on the owner's Mac

[[secret]]
name = "prereg/postgres"
what = "the postgres password of prereg-prod, in the macOS keychain"
used_by = "applying migrations from the owner's Mac"
can = "everything in the database, including SET ROLE prereg_owner"
must_never = "be stored in GitHub, in a file, or in the repo"
expires = "2026-11-20"  # reset at the end of Build day 8, which ends this access
rotate = "Supabase dashboard > Database > Settings > Reset password, then update the keychain item"

[[secret]]
name = "prereg/triage_agent, prereg/notary, prereg/observer"
what = "the role passwords, in the macOS keychain"
used_by = "the grant test and local checks; Actions holds its own copies inside the DB URLs"
can = "log in as that role"
must_never = "be typed into SQL: only SCRAM verifiers go to the database (scripts/role_password.py)"
expires = "never"
rotate = "scripts/role_password.py <role>, then update the matching GitHub secret"

[[secret]]
name = "the gh CLI token"
what = "the owner's GitHub CLI login (classic OAuth token: repo, workflow, read:org, gist)"
used_by = "pushes and gh secret set from the owner's Mac"
can = "write to every repository of the owner"
must_never = "be stored as a secret of any repository"
expires = "never"
rotate = "replaced on Day 6 by a fine-grained token for this repo only"
