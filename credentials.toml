# credentials.toml: every secret this project uses, what it can do, when it expires, and what it must never do.
# No value is ever written here or anywhere in the repo. The watchdog (Build day 1) warns 14 days before an expiry.
# "expires" is a date (YYYY-MM-DD), "never", or "per run".

# ---------------------------------------------------------------- GitHub Actions secrets

[[secret]]
name = "PREREG_READ_TOKEN"
what = "GitHub fine-grained token 'prereg-read'"
used_by = "the poll job (tick.yml), to list new supabase/supabase issues"
can = "read public repositories; it has no permissions"
must_never = "write anything, anywhere"
expires = "2027-02-01"  # 19:00 UTC, from GitHub's github-authentication-token-expiration header (Check 9)
rotate = "create a new 'prereg-read' in the browser, save it with gh secret set, then delete the old one"

[[secret]]
name = "TRIAGE_DB_URL"
what = "Supabase session pooler login for the role triage_agent"
used_by = "the poll job"
can = "call its functions only: enqueue, claim, complete, record a failure or a probe, log a polled event, and five reads (newest_first_sight, unanchored_guesses, spend_today, recent_provider_failures, losses_since); no table right"
must_never = "change or delete a row, set an id or a time, or add an anchor (check_roles.sql, tests/test_db_grants.py)"
expires = "never"
rotate = "scripts/role_password.py triage_agent, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "NOTARY_DB_URL"
what = "Supabase session pooler login for the role notary"
used_by = "the anchor job"
can = "add anchors through record_anchor only; read predictions and anchors"
must_never = "change or delete a row, set an id or a time, or add a guess"
expires = "never"
rotate = "scripts/role_password.py notary, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "COLLECTOR_DB_URL"
what = "Supabase session pooler login for the role collector"
used_by = "the daily outcomes job (outcomes.yml)"
can = "add label events through record_outcome only; read issues_seen"
must_never = "add, change or delete a guess, an anchor or any other row"
expires = "never"
rotate = "scripts/role_password.py collector, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "OBSERVER_DB_URL"
what = "Supabase session pooler login for the role observer"
used_by = "the weekly report (weekly.yml, its build job only)"
can = "read every ledger table"
must_never = "add, change or delete any row; reach a job that can post (the post job gets only the report text)"
expires = "never"
rotate = "scripts/role_password.py observer, run the ALTER ROLE line as postgres, then gh secret set"

[[secret]]
name = "ANTHROPIC_API_KEY"
what = "the owner's existing Anthropic API key (a personal key)"
used_by = "the poll job only; the anchor job never gets it"
can = "call Claude models; the Admin API refuses it (checked on 2026-11-04)"
must_never = "spend more than $3 a day for the live job (DAILY_CAP_USD in runner/worker.py, checked with prereg.spend_today); it has no workspace limit"
expires = "unknown"  # shown on the Console's API keys page
rotate = "create a key in the Console, save it with gh secret set, then disable the old one"

[[secret]]
name = "HC_TICK_URL"
what = "Healthchecks.io ping URL of the check 'tick' (period 15 min, grace 30 min)"
used_by = "both jobs, once per healthy tick"
can = "mark the check as up"
must_never = "be pinged after a failed tick"
expires = "never"
rotate = "create a new check in Healthchecks, save its URL with gh secret set, then delete the old check"

[[secret]]
name = "GITHUB_TOKEN"
what = "the short-lived token GitHub gives each workflow run"
used_by = "every job: contents: read for the checkout (not kept on disk). issues: write in three jobs only: the anchor job, the outcomes alert job and the weekly post job; actions: read in the weekly build job; actions: write in dispatch.yml"
can = "where it has issues: write, comment on, label or close issues in this repo (GitHub has no comment-only permission); in dispatch.yml, start or cancel this repo's runs"
must_never = "write anything but a Notary log anchor, one alert issue, a weekly report comment or the start of a probe run"
expires = "per run"
rotate = "nothing to rotate"

# ---------------------------------------------------------------- only on the owner's Mac

[[secret]]
name = "prereg/postgres"
what = "the postgres password of prereg-prod, in the macOS keychain"
used_by = "applying migrations from the owner's Mac"
can = "everything in the database, including SET ROLE prereg_owner"
must_never = "be stored in GitHub, in a file, or in the repo"
expires = "2026-11-20"  # reset at the end of Build day 8, which ends this access
rotate = "Supabase dashboard > Database > Settings > Reset password, then update the keychain item"

[[secret]]
name = "prereg/triage_agent, prereg/notary, prereg/observer, prereg/collector"
what = "the role passwords, in the macOS keychain"
used_by = "the grant test and local checks; Actions holds its own copies inside the DB URLs"
can = "log in as that role"
must_never = "be typed into SQL: only SCRAM verifiers go to the database (scripts/role_password.py)"
expires = "never"
rotate = "scripts/role_password.py <role>, then update the matching GitHub secret"

[[secret]]
name = "the gh CLI token"
what = "the owner's GitHub CLI login (classic OAuth token: repo, workflow, read:org, gist)"
used_by = "pushes and gh secret set from the owner's Mac"
can = "write to every repository of the owner"
must_never = "be stored as a secret of any repository"
expires = "never"
rotate = "replaced on Day 6 by a fine-grained token for this repo only"

# ---------------------------------------------------------------- the privilege matrix
# tests/test_privilege_matrix.py checks that every role except superusers, prereg_owner and the pg_* roles
# holds exactly this in schemas prereg and pgmq, and nothing more. "*" means every table, or every sequence.
# A role not listed (anon, authenticated, service_role and the other platform roles) holds nothing there.
# prereg_owner owns the ledger and its functions; for them it holds USAGE on schema pgmq and SELECT,
# INSERT, UPDATE and DELETE on pgmq.q_triage_events and pgmq.q_triage_dlq (db/004_functions.sql).

[privileges.triage_agent]  # no table right at all since db/006_revoke.sql: functions only
usage = ["prereg"]
execute = ["claim_next", "complete", "enqueue_issue", "log_event", "losses_since", "newest_first_sight",
           "recent_provider_failures", "record_failure", "record_probe", "spend_today", "unanchored_guesses"]

[privileges.notary]
usage = ["prereg"]
select = ["anchors", "predictions"]  # the rows it hashes
execute = ["record_anchor"]

[privileges.collector]
usage = ["prereg"]
select = ["issues_seen"]
execute = ["record_outcome"]

[privileges.observer]
usage = ["prereg"]
select = ["*"]  # default privileges give observer every new table

# Supabase makes these three members of pg_read_all_data: they read everything and change nothing.
[privileges.postgres]
usage = ["prereg", "pgmq"]
create = ["pgmq"]  # postgres created the pgmq extension, so it owns that schema
select = ["*"]
sequence_select = ["*"]

[privileges.supabase_etl_admin]
usage = ["prereg", "pgmq"]
select = ["*"]
sequence_select = ["*"]

[privileges.supabase_read_only_user]
usage = ["prereg", "pgmq"]
select = ["*"]
sequence_select = ["*"]
