name: outcomes

# Once a day: save the label events on every issue seen in the last 29 days (outcomes/collect.py), and open
# one alert issue if a label appears that rules/ground_truth.toml neither maps nor ignores.
on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

concurrency:
  group: outcomes
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read  # checkout only: no GitHub write rights
    outputs:
      unknown: ${{ steps.collect.outputs.unknown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - id: collect
        run: .venv/bin/python -m outcomes.collect
        env:
          COLLECTOR_DB_URL: ${{ secrets.COLLECTOR_DB_URL }}  # the collector role: record_outcome only
          PREREG_READ_TOKEN: ${{ secrets.PREREG_READ_TOKEN }}

  alert:
    needs: collect
    if: needs.collect.outputs.unknown != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write  # one issue or comment per alert type per 6 hours; the only login is notifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - name: Open one alert issue for unknown labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTIFIER_DB_URL: ${{ secrets.NOTIFIER_DB_URL }}  # spends from the contact budget only
          ALERT_SOURCE: outcomes
          UNKNOWN: ${{ needs.collect.outputs.unknown }}
        run: |
          ALERTS="$(python3 -c 'import json, os; print(json.dumps({"unknown_label": "new Supabase labels that rules/ground_truth.toml neither maps nor ignores: " + os.environ["UNKNOWN"] + "; add each to [areas] or [ignore] by pull request"}))')" \
            .venv/bin/python -m ops.open_alerts
