name: ci

# Every push and pull request: the unit tests, then every migration and database test on a throwaway
# copy of Supabase's own Postgres image, the version prereg-prod runs. No secret is used here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      db:
        image: supabase/postgres:17.11.0.018@sha256:7c31363a3f7434ff14945f1b8a4880e6eca8b362e197e88b87c476c77aa3cf8c
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PREREG_TEST_ADMIN_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      TRIAGE_DB_URL: postgresql://triage_agent:test-only@localhost:5432/postgres
      NOTARY_DB_URL: postgresql://notary:test-only@localhost:5432/postgres
      OBSERVER_DB_URL: postgresql://observer:test-only@localhost:5432/postgres
      COLLECTOR_DB_URL: postgresql://collector:test-only@localhost:5432/postgres
      GATE_DB_URL: postgresql://gate_runner:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the commit messages of a pull request, for the reference lint
      - name: Reference lint on the pull request's text and commit messages
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > pull_request.txt
          git log --format=%B "$BASE..$HEAD" > commits.txt
          python3 scripts/lint_refs.py pull_request.txt commits.txt
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - name: Unit tests
        run: |
          .venv/bin/python tests/test_canonical.py
          .venv/bin/python tests/test_champion.py
          .venv/bin/python tests/test_lint_refs.py
          .venv/bin/python tests/test_probe.py
          .venv/bin/python tests/test_budget.py
          .venv/bin/python evals/triage/EVAL_test.py
          .venv/bin/python evals/safety/EVAL_test.py
          .venv/bin/python tests/test_registry.py
          .venv/bin/python tests/test_quiet_failure.py
          .venv/bin/python tests/test_gate.py
          .venv/bin/python tests/test_known_bad.py
      - name: Migrations and check_roles.sql
        run: .venv/bin/python tests/setup_test_db.py
      - name: db/catalog.json matches the functions the migrations make
        run: .venv/bin/python -m ops.drift --check-catalog
      - name: Queue functions (dead letters, temp-table hijack, repeats)
        run: .venv/bin/python tests/test_db_functions.py
      - name: Privilege matrix equals credentials.toml
        run: .venv/bin/python tests/test_privilege_matrix.py
      - name: Grant test (every forbidden attempt denied with 42501)
        run: .venv/bin/python tests/test_db_grants.py
      - name: One tick end to end (fake GitHub and Claude)
        run: .venv/bin/python tests/test_tick.py
      - name: Kill test (kill -9 the worker mid-batch)
        run: .venv/bin/python tests/test_rollback.py
      - name: Weekly report v0 (counts per day)
        run: .venv/bin/python tests/test_weekly_report.py
      - name: Suite runner and noise floor (fake Claude)
        run: .venv/bin/python tests/test_suite.py
      - name: Watchdog checks (fake GitHub)
        run: .venv/bin/python tests/test_watchdog.py
      - name: Drift check (it changes the database and puts it back, so it runs last)
        run: .venv/bin/python tests/test_drift.py
