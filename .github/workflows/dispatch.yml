name: dispatch

# The bot dispatcher. You start this by hand; it holds no write token. It only uses its GITHUB_TOKEN to
# start the run that needs the sandbox write token. That run's triggering actor is then the bot, so you
# can approve it even with "prevent self-review" on. Never start or re-run the write run yourself.
on:
  workflow_dispatch:
    inputs:
      workflow:
        description: The run to start
        type: choice
        options: [probe.yml]
        default: probe.yml

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write  # to start one workflow; nothing else
    steps:
      - run: gh workflow run "$WORKFLOW" -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
