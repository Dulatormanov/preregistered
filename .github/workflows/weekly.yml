name: weekly

# The weekly report (ops/weekly_report.py): one comment on the Weekly reports issue each Monday. The numbers come
# from code; the report agent (agents/weekly_report.py) adds a short summary, which the post job checks for the four
# failure modes first (agents/report_checks.py), and leaves out if it breaks any.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      post:
        description: Post the report (off = build it and show it in the log only)
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the run list
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - id: report
        run: |
          REPORT_DATA=data.json .venv/bin/python -m ops.weekly_report > report.md
          cat report.md  # counts only, so the log may show it
          { echo "report<<EOF_REPORT"; cat report.md; echo "EOF_REPORT"; } >> "$GITHUB_OUTPUT"
        env:
          OBSERVER_DB_URL: ${{ secrets.OBSERVER_DB_URL }}  # the observer role: reads, never writes
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: week
          path: data.json
          retention-days: 30

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # a model key and no write right (the registry rule)
    outputs:
      summary: ${{ steps.draft.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: week
      - id: draft
        run: |
          .venv/bin/python -m agents.weekly_report data.json
          { echo "summary<<EOF_SUMMARY"; cat summary.txt; echo; echo "EOF_SUMMARY"; } >> "$GITHUB_OUTPUT"
        env:
          GATE_DB_URL: ${{ secrets.GATE_DB_URL }}  # the gate's cap covers this one call
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  post:
    needs: [build, draft]
    if: always() && needs.build.result == 'success' && (github.event_name == 'schedule' || inputs.post)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write  # one comment a week on the Weekly reports issue; the only login is notifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: week
          path: week
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTIFIER_DB_URL: ${{ secrets.NOTIFIER_DB_URL }}  # spends from the contact budget only
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ needs.build.outputs.report }}
          SUMMARY: ${{ needs.draft.outputs.summary }}
        run: |
          printf '%s\n' "$REPORT" > report.md
          printf '%s' "$SUMMARY" > summary.txt
          .venv/bin/python -m agents.report_post report.md summary.txt week/data.json  # the four checks: summary or not
          python3 scripts/lint_refs.py report.md  # every posted text passes the reference lint
          .venv/bin/python -c "import sys; from ops.notify import spend; sys.exit(0 if spend('weekly_report') else 'the contact budget refused a second weekly report this week (23505)')"
          gh issue comment 2 --body-file report.md  # issue 2 is "Weekly reports (subscribe here)"
