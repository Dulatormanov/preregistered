name: suite

# The triage agent's suite (gate/run_suite.py) on main: once after each push that changes an agent file, so
# eval-gate always compares with main's current agent, and the A/A runs for the noise floor, started by hand. The log shows counts only; the results file
# (codes and hashes, no issue text) and the noise floor are kept as an artifact for 90 days.
on:
  schedule:
    - cron: "13 6 * * 1"  # Monday: a fresh A/A pair, compared with the committed noise floor
  push:
    branches: [main]
    paths: [models.lock, "prompts/**", taxonomy.toml, "agents/champion.py", "agents/guards.py", "agents/rules_v0.py",
            "core/**", "evals/**", "suites/**", gate/run_suite.py]
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run the whole suite (5 for the A/A noise floor)
        type: number
        default: 1

permissions: {}

concurrency:
  group: suite
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read  # a model key and no write right (the registry rule)
    outputs:
      grew: ${{ steps.suite.outputs.grew }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # wheels only, so installing runs no package code
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --only-binary :all: -r requirements.txt
      - id: suite
        run: |
          .venv/bin/python -m gate.run_suite triage --runs "$RUNS" --out results.jsonl
          .venv/bin/python -m gate.noise_floor results.jsonl --compare gate/noise_floor.json > noise_floor.json
          cat noise_floor.json
        env:
          RUNS: ${{ github.event_name == 'schedule' && 2 || inputs.runs || 1 }}  # a push runs it once, Monday twice
          GATE_DB_URL: ${{ secrets.GATE_DB_URL }}  # gate_runner: its own steps and spend only
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREREG_READ_TOKEN: ${{ secrets.PREREG_READ_TOKEN }}  # reads the dev-set issues
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: suite-results
          path: |
            results.jsonl
            noise_floor.json
          retention-days: 90

  alert:
    needs: run
    if: github.event_name == 'schedule' && needs.run.outputs.grew != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write  # one alert issue; this job holds no model key and no database login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_SOURCE: suite
          ALERTS: '{"noise_floor_grew": "the fresh A/A pair moved more than gate/noise_floor.json: measure the floor again"}'
        run: python3 -m ops.open_alerts
